<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@100..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400..700&family=Momo+Trust+Display&family=Mulish:ital,wght@0,200..1000;1,200..1000&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="15.css">
    <link rel="icon" type="image/svg" href="{{ url_for('static', filename='img/Logo.svg') }}">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <title>Mis quince años</title>
</head>
<body>
    <div id="Frame1" class="Frame {% if frame_activo == 'Frame1' %}visible{% endif %}"> 
        <div class="flores_esquina_cont" data-aos="fade-up-left">
            <img class="flores_esquina" src="img/flores_esquina.png">
        </div>
        <div class="Cuadro1" data-aos="zoom-in">
            <div data-aos="flip-left" class="crown-cont">
                <img class="crown" src="img/crown.png">
            </div>
            <h1 data-aos="fade-down">Mis 15 años</h1>
            <h2 data-aos="fade-up">Laura Garzón</h2>
            <div class="sobre-cont" >
                <img class="decorado DebeOcultar" src="img/decorado.png" data-aos="flip-down">
                <img id="Sobre" class="sobre" src="img/sobre.png" data-aos="flip-down">
                <img class="solapa" src="img/solapa.png" data-aos="flip-down">
                <a class="Boton_Sello DebeOcultar" href="https://www.laura15.online/Yesid2.html">
                    <img class="sello" src="img/sello.png" data-aos="flip-down">
                </a>
                <img class="luz"src="img/light.png">
            </div>
            <img id="Simbolo" src="img/flecha.png" data-aos="flip-down">
            <h1 id="Simbolo2" data-aos="flip-down">Toca el boton!</h1>
            <img class="luz2"src="img/light.png">
            <img class="luz3"src="img/light.png">
        </div>
        <div class="flores_esquina_cont2" data-aos="fade-down-right">
            <img class="flores_esquina2" src="img/flores_esquina.png">
        </div>
        <div class="mariposa1">
            <img class="mariposa" src="img/mariposa.png">
        </div>
        <div class="mariposa3">
            <img class="mariposa" src="img/mariposa.png">
        </div>
        <div class="mariposa4">
            <img class="mariposa" src="img/mariposa.png">
        </div>
        <div class="mariposa5">
            <img class="mariposa" src="img/mariposa.png">
        </div>
    </div>
    <script src="15.js"></script>
    <script>
        AOS.init({
            duration: 1000,
            once: true,
            offset: 0
        });
        ScrollReveal({
            reset: true,
            distance: '60px',
            duration: 1000,
            easing: 'ease'
        });
    </script>
</body>
</html>
