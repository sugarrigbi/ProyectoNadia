<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Demasiados Intentos</title>

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
    background: linear-gradient(135deg,#0d6efd,#6610f2);
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family: system-ui;
}

.error-card{
    max-width:500px;
    border-radius:20px;
    padding:40px;
    box-shadow:0 20px 40px rgba(0,0,0,0.2);
}

.icon{
    font-size:70px;
}

.retry{
    font-size:14px;
    color:#6c757d;
}
</style>

</head>

<body>

<div class="card error-card text-center">

<div class="icon text-warning mb-3">
⚠️
</div>

<h2 class="fw-bold">Demasiados intentos</h2>

<p class="text-muted">
Has excedido el número máximo de intentos permitidos.<br>
Por seguridad el acceso ha sido temporalmente bloqueado.
</p>

<div class="alert alert-warning mt-3">
Intenta nuevamente en unos minutos.
</div>

<a href="https://gaialink.online" class="btn btn-primary btn-lg mt-3">
Volver al inicio
</a>

<p class="retry mt-3">
Si crees que esto es un error, espera unos minutos antes de volver a intentar.
</p>

</div>

</body>
</html>
