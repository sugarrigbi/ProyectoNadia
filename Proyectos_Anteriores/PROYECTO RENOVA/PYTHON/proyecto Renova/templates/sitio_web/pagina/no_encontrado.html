{% extends 'sitio_web/layout.html' %}

{% block titulo %}No encontrado{% endblock %}

{% block contenido %}
<section class="py-5">
    <div class="container text-center">
        <div class="card shadow-lg border-0 rounded-4 p-5">
            <h2 class="text-danger fw-bold">No se encontró resultado</h2>
            <p class="text-muted mt-3">
                No encontramos coincidencias para: <strong>{{ busqueda }}</strong>
            </p>
            <a href="{{ url_for('inicio') }}" class="btn btn-primary rounded-pill px-4 mt-3">
                Volver al inicio
            </a>
        </div>
    </div>
</section>
{% endblock %}
