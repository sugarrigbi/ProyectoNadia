<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="RENOVA - Plataforma para la gestión y seguimiento de procesos de reinserción social">
    <meta name="author" content="RENOVA">
    <title>{% block titulo %}RENOVA S.R.R{% endblock %}</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <!-- CSS propio -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body class="d-flex flex-column min-vh-100 bg-light">

    <!-- NAVBAR -->
    {% include "sitio_web/plantillas/menu.html" %}

    <!-- CONTENIDO -->
    <main class="flex-grow-1">
        {% block contenido %}
        {% endblock %}
    </main>

    <!-- FOOTER -->
    <footer class="bg-dark text-white mt-5">
        <div class="container py-4">
            <div class="row text-center text-md-start align-items-center">

                <div class="col-md-6 mb-3 mb-md-0">
                    <h5 class="fw-bold mb-1">RENOVA S.R.R</h5>
                    <p class="mb-0 small">
                        Plataforma orientada a la gestión, organización y seguimiento de procesos de reinserción social.
                    </p>
                </div>

                <div class="col-md-6 text-md-end">
                    <p class="mb-1">
                        <i class="bi bi-shield-check"></i> Seguridad |
                        <i class="bi bi-people-fill"></i> Compromiso |
                        <i class="bi bi-lightbulb-fill"></i> Innovación
                    </p>
                    <p class="mb-0 small">© 2026 RENOVA S.R.R - Todos los derechos reservados</p>
                </div>

            </div>
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
