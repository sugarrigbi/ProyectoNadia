<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Registro Profesional</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/stile_registro.css">


</head>

<body>
  <div class="frame">
    <div class="inner">
      <h2>Registro</h2>
      <p>Crea tu cuenta en dos pasos</p>

      <form id="registroForm">
        <div class="grid-2">
          <!-- Nombre -->
          <div>
            <label for="nombre">Nombre</label>
            <input type="text" id="nombre" placeholder="Tu nombre" pattern="[A-Za-zÁÉÍÓÚáéíóúÑñ\s]+" title="Solo letras" required>
          </div>

          <!-- Apellido -->
          <div>
            <label for="apellido">Apellido</label>
            <input type="text" id="apellido" placeholder="Tu apellido" pattern="[A-Za-zÁÉÍÓÚáéíóúÑñ\s]+" title="Solo letras" required>
          </div>

          <!-- Correo -->
          <div>
            <label for="correo">Correo</label>
            <input type="email" id="correo" placeholder="usuario@correo.com" required>
          </div>

          <!-- Teléfono -->
          <div>
            <label for="telefono">Teléfono</label>
            <input type="tel" id="telefono" placeholder="3001234567" pattern="[0-9]{7,15}" title="Solo números" required>
          </div>

          <!-- Tipo documento -->
          <div>
            <label for="tipoDoc">Tipo de documento</label>
            <select id="tipoDoc" required>
              <option value="">Seleccione</option>
              <option value="cc">Cédula de ciudadanía</option>
              <option value="ce">Cédula de extranjería</option>
              <option value="ti">Tarjeta de identidad</option>
              <option value="pp">Pasaporte</option>
            </select>
          </div>

          <!-- Número documento -->
          <div>
            <label for="numDoc">Número de documento</label>
            <input type="text" id="numDoc" placeholder="Número de documento" pattern="[0-9]+" title="Solo números" required>
          </div>

          <!-- Usuario -->
          <div>
            <label for="usuario">Usuario</label>
            <input type="text" id="usuario" placeholder="Usuario" pattern="[A-Za-zÁÉÍÓÚáéíóúÑñ\s]+" title="Solo letras" required>
          </div>

          <!-- Contraseña -->
          <div>
            <label for="pass">Contraseña</label>
            <input type="password" id="pass" placeholder="••••••••" 
              pattern="^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,}$" 
              title="Mínimo 8 caracteres, una mayúscula, una minúscula, un número y un carácter especial" 
              required>
            <div class="policy">Debe tener mínimo 8 caracteres, incluir mayúscula, minúscula, número y carácter especial.</div>
          </div>
        </div>

        <button class="btn" type="submit">Registrarse</button>
      </form>

      <div class="extra-links">
        <span>¿Ya tienes cuenta?
          <a href="login">Inicia sesión</a>
        </span>
      </div>
    </div>
  </div>

  <!-- Modal de éxito -->
  <div class="modal" id="modalExito">
    <div class="modal-content">
      <h3>✅ Registro exitoso</h3>
      <p>Tu cuenta ha sido creada correctamente.</p>
      <a href="http://127.0.0.1:5000/login">Iniciar sesión</a>
    </div>
  </div>

  <script>
    const form = document.getElementById("registroForm");
    const modal = document.getElementById("modalExito");

    form.addEventListener("submit", function(e){
      e.preventDefault(); // evita envío real
      modal.classList.add("active");
    });
  </script>
</body>
</html>
