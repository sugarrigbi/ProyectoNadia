      {% with messages = get_flashed_messages() %}
        {% if messages %}
          <div class="flash">{{ messages[0] }}</div>
        {% endif %}
      {% endwith %}

      {% if estado_bloqueado and desbloqueo_timestamp %}
      <div id="bloqueo-msg" style="background: #fdd; padding: 10px; margin-bottom: 10px;">
          Contraseña incorrecta. Usuario bloqueado. Tiempo restante: <span id="tiempo-restante"></span>
      </div> 

      <script>
      let desbloqueo = parseInt("{{ desbloqueo_timestamp }}") * 1000;
      let span = document.getElementById("tiempo-restante");

      function actualizarTemporizador() {
          let ahora = Date.now();
          let segundosTotales = Math.floor((desbloqueo - ahora) / 1000);

          if (segundosTotales <= 0) {
              span.textContent = "0:00";
              clearInterval(timer);
              return;
          }

          let min = Math.floor(segundosTotales / 60);
          let seg = segundosTotales % 60;
          span.textContent = min + ":" + (seg < 10 ? '0' + seg : seg);
      }

      actualizarTemporizador();
      let timer = setInterval(actualizarTemporizador, 1000);
      </script>
      {% endif %}
