<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
        <title>Document</title>
        <style>
            .Account_Mobile{
                width: 100%;
                display: flex;
                flex-direction: column;
                gap: 1rem;
                padding: 1rem;
            }

            /* PERFIL */

            .Profile_Card{
                background: #1e1e1e;
                border-radius: 1.5rem;
                padding: 1.2rem;
                display: flex;
                align-items: center;
                gap: 1rem;
            }

            .Profile_Avatar{
                width: 70px;
                height: 70px;
                border-radius: 50%;
                background: #3b82f6;
                display: flex;
                align-items: center;
                justify-content: center;
                color: white;
                font-size: 1.4rem;
                font-weight: 700;
                flex-shrink: 0;
            }

            .Profile_Info{
                width: 100%;
            }

            .Profile_Info h2{
                margin: 0;
                color: white;
                font-size: 1.2rem;
            }

            .Profile_Info p{
                margin: .2rem 0 0 0;
                color: #b3b3b3;
                font-size: .9rem;
            }

            .Profile_Badges{
                margin-top: .7rem;
                display: flex;
                flex-wrap: wrap;
                gap: .5rem;
            }

            .Badge_Admin{
                background: #312e81;
                color: #c7d2fe;
                padding: .35rem .7rem;
                border-radius: 999px;
                font-size: .75rem;
            }

            .Badge_Active{
                background: #14532d;
                color: #bbf7d0;
                padding: .35rem .7rem;
                border-radius: 999px;
                font-size: .75rem;
            }

            /* MENU */

            .Mobile_Menu{
                display: flex;
                gap: .6rem;
                overflow-x: auto;
                padding-bottom: .3rem;
            }

            .Mobile_Menu button{
                border: none;
                border-radius: 999px;
                padding: .7rem 1rem;
                background: #262626;
                color: white;
                white-space: nowrap;
                flex-shrink: 0;
                font-size: .9rem;
            }

            .Menu_Active{
                background: #3b82f6 !important;
            }

            .Text_Danger{
                background: #7f1d1d !important;
            }

            /* SECTION */

            .Mobile_Section{
                display: flex;
                flex-direction: column;
                gap: 1rem;
            }

            .Section_Header{
                padding: .5rem;
            }

            .Section_Header h2{
                margin: 0;
                color: white;
                font-size: 1.2rem;
            }

            .Section_Header p{
                margin-top: .3rem;
                color: #a1a1aa;
                font-size: .9rem;
            }

            /* MINI SECTIONS */

            .Mini_Section{
                background: #1e1e1e;
                border-radius: 1.3rem;
                padding: 1rem;
                display: flex;
                flex-direction: column;
                gap: .9rem;
            }

            .Mini_Section h3{
                margin: 0;
                color: white;
                font-size: 1rem;
            }

            /* FORM */

            .Form_Group{
                display: flex;
                flex-direction: column;
                gap: .4rem;
            }

            .Form_Group label{
                color: #d4d4d8;
                font-size: .85rem;
            }

            .Form_Group input,
            .Form_Group select{
                width: 100%;
                border: 1px solid #3f3f46;
                background: #27272a;
                color: white;
                border-radius: .9rem;
                padding: .85rem 1rem;
                outline: none;
                font-size: .95rem;
            }

            .Form_Group input:focus,
            .Form_Group select:focus{
                border-color: #3b82f6;
            }

            /* INFO */

            .Info_Row{
                display: flex;
                flex-direction: column;
                gap: .2rem;
            }

            .Info_Row span{
                color: #9ca3af;
                font-size: .8rem;
            }

            .Info_Row strong{
                color: white;
                font-size: .95rem;
            }

            /* BOTONES */

            .Bottom_Actions{
                position: sticky;
                bottom: 0;
                display: flex;
                gap: .8rem;
                padding-top: .5rem;
                background: linear-gradient(to top, #111111 70%, transparent);
            }

            .Bottom_Actions button{
                flex: 1;
                border: none;
                border-radius: 1rem;
                padding: .95rem;
                color: white;
                font-size: .95rem;
                font-weight: 600;
            }

            .Btn_Cancel{
                background: #3f3f46;
            }

            .Btn_Save{
                background: #2563eb;
            }
        </style>
    </head>
    <body>
        <div class="Account_Mobile">

            <!-- PERFIL -->
            <section class="Profile_Card">
                <div class="Profile_Avatar">
                    <span>Su</span>
                </div>

                <div class="Profile_Info">
                    <h2>Sugarrigbi</h2>
                    <p>sugarrigbi@gmail.com</p>

                    <div class="Profile_Badges">
                        <span class="Badge_Admin">Administrador</span>
                        <span class="Badge_Active">Activo</span>
                    </div>
                </div>
            </section>

            <!-- MENU -->
            <nav class="Mobile_Menu">
                <button class="Menu_Active">Mis datos</button>
                <button>Ubicación</button>
                <button>Seguridad</button>
                <button>Cuenta</button>
                <button>Preferencias</button>
                <button class="Text_Danger">Eliminación</button>
            </nav>

            <!-- SECCION -->
            <section class="Mobile_Section">

                <div class="Section_Header">
                    <h2>Información personal</h2>
                    <p>Edita tu información básica</p>
                </div>

                <!-- MINI SECCION -->
                <div class="Mini_Section">

                    <h3>Datos personales</h3>

                    <div class="Form_Group">
                        <label>Primer nombre</label>
                        <input type="text">
                    </div>

                    <div class="Form_Group">
                        <label>Segundo nombre</label>
                        <input type="text">
                    </div>

                    <div class="Form_Group">
                        <label>Primer apellido</label>
                        <input type="text">
                    </div>

                    <div class="Form_Group">
                        <label>Segundo apellido</label>
                        <input type="text">
                    </div>

                    <div class="Form_Group">
                        <label>Fecha de nacimiento</label>
                        <input type="date">
                    </div>

                </div>

                <!-- MINI SECCION -->
                <div class="Mini_Section">

                    <h3>Documento</h3>

                    <div class="Form_Group">
                        <label>Tipo de documento</label>
                        <select>
                            <option>Cédula</option>
                        </select>
                    </div>

                    <div class="Form_Group">
                        <label>Número de documento</label>
                        <input type="text">
                    </div>

                </div>

                <!-- MINI SECCION -->
                <div class="Mini_Section">

                    <h3>Contacto</h3>

                    <div class="Form_Group">
                        <label>Teléfono</label>
                        <input type="text">
                    </div>

                    <div class="Form_Group">
                        <label>Dirección</label>
                        <input type="text">
                    </div>

                </div>

                <!-- DATOS NO EDITABLES -->
                <div class="Mini_Section">

                    <h3>Datos no editables</h3>

                    <div class="Info_Row">
                        <span>Usuario</span>
                        <strong>Sugarrigbi</strong>
                    </div>

                    <div class="Info_Row">
                        <span>Correo</span>
                        <strong>sugarrigbi@gmail.com</strong>
                    </div>

                    <div class="Info_Row">
                        <span>Fecha creación</span>
                        <strong>18/03/2026</strong>
                    </div>

                </div>

            </section>

            <!-- BOTONES -->
            <div class="Bottom_Actions">
                <button class="Btn_Cancel">Cancelar</button>
                <button class="Btn_Save">Guardar cambios</button>
            </div>

        </div>
    </body>
</html>
